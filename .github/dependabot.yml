version: 2
updates:
  - package-ecosystem: "gomod"
    # Local replace directives couple these modules. Update them together so
    # examples and adapters retain tidy manifests after a core/framework bump.
    directories:
      - "/"
      - "/http"
      - "/fiber"
      - "/echo"
      - "/gin"
      - "/examples"
      - "/integration/mysql"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci-actions:
        patterns: ["*"]
