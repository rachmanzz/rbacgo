name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct

jobs:
  test-core:
    name: test (core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rbac
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rbac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rbac -d rbac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: |
            go.sum
            http/go.sum
            fiber/go.sum
            echo/go.sum
            gin/go.sum
            examples/go.sum
            integration/mysql/go.sum

      - name: gofmt (repo-wide)
        run: |
          if [ -n "$(gofmt -l .)" ]; then gofmt -l .; exit 1; fi

      - name: go.mod tidy
        working-directory: .
        run: go mod tidy -diff

      - name: Build
        working-directory: .
        run: go build ./...

      - name: Vet
        working-directory: .
        run: go vet ./...

      - name: Test (race)
        working-directory: .
        run: go test -race -count=1 ./...

      - name: Postgres integration test
        env:
          RBAC_TEST_POSTGRES_DSN: postgres://rbac:test@localhost:5432/rbac?sslmode=disable
        run: go test -tags integration -count=1 -run 'Postgres' ./...

  test-adapters:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [http, fiber, echo, gin, examples, integration/mysql]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: |
            go.sum
            http/go.sum
            fiber/go.sum
            echo/go.sum
            gin/go.sum
            examples/go.sum
            integration/mysql/go.sum

      - name: go.mod tidy
        working-directory: ${{ matrix.module }}
        run: go mod tidy -diff

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test (race)
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

  fuzz:
    name: fuzz (30s per target)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: Fuzz hierarchy resolution vs oracle
        run: go test -run '^$' -fuzz '^FuzzHierarchyResolution$' -fuzztime=30s .

      - name: Fuzz graph safety
        run: go test -run '^$' -fuzz '^FuzzGraphSafety$' -fuzztime=30s .

      - name: Fuzz policy version monotonicity
        run: go test -run '^$' -fuzz '^FuzzPolicyVersionMonotonic$' -fuzztime=30s .

  security:
    name: security (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: govulncheck (all modules)
        run: |
          set -e
          for mod in . http fiber echo gin examples integration/mysql; do
            echo "== $mod =="
            # Symbol-level vulnerabilities fail the job. Keep dated scan
            # evidence in the audit report rather than assuming a fixed residual.
            if [ "$mod" = integration/mysql ]; then
              (cd "$mod" && go run golang.org/x/vuln/cmd/govulncheck@latest -test ./...)
            else
              (cd "$mod" && go run golang.org/x/vuln/cmd/govulncheck@latest ./...)
            fi
          done

  compliance:
    name: compliance (license + notices + deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: LICENSE + THIRD_PARTY_NOTICES present
        run: |
          test -f LICENSE || { echo "LICENSE missing"; exit 1; }
          test -f THIRD_PARTY_NOTICES || { echo "THIRD_PARTY_NOTICES missing"; exit 1; }
          for name in go-sqlite3 go-redis miniredis pgx fiber echo gin go-mysql; do
            grep -qi "$name" THIRD_PARTY_NOTICES || { echo "notice missing for $name"; exit 1; }
          done

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: Direct dependencies up to date (warning only)
        run: |
          for mod in . http fiber echo gin examples integration/mysql; do
            echo "== $mod =="
            (cd "$mod" && go mod edit -json | jq -r '.Require[] | select(.Indirect != true) | .Path' \
              | grep -v '^github.com/rachmanzz/rbacgo$' | while read -r p; do
                cur=$(go mod edit -json | jq -r --arg p "$p" '.Require[] | select(.Path == $p) | .Version')
                up=$(go list -m -u "$p" 2>/dev/null | awk '{print $3}' | tr -d '[]')
                if [ -n "$up" ] && [ "$up" != "" ] && [ "$up" != "$cur" ]; then
                  echo "  $p: $cur -> $up"
                fi
              done)
          done

  test-mysql:
    name: integration (MySQL 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rbac-test-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: rbac
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -prbac-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - name: MySQL policy, isolation, and rollback
        working-directory: integration/mysql
        env:
          RBAC_TEST_MYSQL_DSN: root:rbac-test-only@127.0.0.1:3306/rbac
        run: go test -race -count=1 -v ./...

  test-redis-cluster:
    name: integration (Redis Cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - name: Create isolated three-primary cluster
        run: |
          for port in 17100 17101 17102; do
            docker run -d --name "rbacgo-ci-redis-$port" --network host redis:7-alpine redis-server --bind 127.0.0.1 --port "$port" --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000 --appendonly no
          done
          for port in 17100 17101 17102; do
            ready=false
            for attempt in $(seq 1 30); do
              if docker exec "rbacgo-ci-redis-$port" redis-cli -p "$port" ping; then ready=true; break; fi
              sleep 1
            done
            test "$ready" = true
          done
          docker exec rbacgo-ci-redis-17100 redis-cli --cluster create 127.0.0.1:17100 127.0.0.1:17101 127.0.0.1:17102 --cluster-replicas 0 --cluster-yes
      - name: Verify cross-shard cache invalidation
        env:
          RBAC_TEST_REDIS_CLUSTER_ADDRS: 127.0.0.1:17100,127.0.0.1:17101,127.0.0.1:17102
        run: go test -race -tags integration -count=1 -run '^TestRedisClusterFlush$' .
